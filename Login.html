<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            border: none;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center" id="contenedor-principal">
        <div class="card login-card p-4 bg-white">
            <div class="card-body">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-user-shield text-primary fa-3x mb-2"></i>
                    <h3 class="fw-bold">Iniciar Sesión</h3>
                    <p class="text-muted small">Ingresa tus credenciales</p>
                </div>
                
                <div id="error-alert" class="alert alert-danger d-none" role="alert"></div>

                <form id="form-login" onsubmit="enviarCredenciales(event)">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Usuario</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                            <input type="text" class="form-control" id="usuario" name="usuario" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="btn-ingresar">
                        Ingresar
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function enviarCredenciales(e) {
            e.preventDefault();
            
            var formElement = document.getElementById('form-login');
            var btn = document.getElementById('btn-ingresar');
            var alertBox = document.getElementById('error-alert');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Verificando...';
            alertBox.classList.add('d-none');

            // Enviamos el formulario completo serializado
            google.script.run
                .withSuccessHandler(function(response) {
                    if (response.success) {
                        // Cambiamos el diseño a pantalla de Dashboard al autenticarse
                        document.body.className = "bg-light";
                        document.getElementById('contenedor-principal').innerHTML = `
                            <div class="w-100 px-3">
                                <nav class="navbar navbar-dark bg-dark px-4 rounded shadow-sm mb-4">
                                    <span class="navbar-brand mb-0 h1"><i class="fa-solid fa-chart-line text-primary me-2"></i> Dashboard Principal</span>
                                    <div class="text-white d-flex align-items-center">
                                        <span class="badge bg-secondary me-2">ID: ${response.idUsuario}</span>
                                        <span class="me-3 fw-bold"><i class="fa-solid fa-user me-1"></i> ${response.usuario}</span>
                                        <button class="btn btn-outline-light btn-sm" onclick="location.reload()">Cerrar Sesión</button>
                                    </div>
                                </nav>
                                <div class="card shadow-sm border-0 p-4">
                                    <h3>¡Bienvenido al sistema!</h3>
                                    <p class="text-muted mb-0">Has iniciado sesión correctamente con el ID de usuario: <b>${response.idUsuario}</b></p>
                                </div>
                            </div>
                        `;
                    } else {
                        alertBox.innerText = response.message;
                        alertBox.classList.remove('d-none');
                        btn.disabled = false;
                        btn.innerHTML = 'Ingresar';
                    }
                })
                .withFailureHandler(function(err) {
                    alertBox.innerText = "Error crítico de ejecución: " + err.message;
                    alertBox.classList.remove('d-none');
                    btn.disabled = false;
                    btn.innerHTML = 'Ingresar';
                })
                .validarLogin(formElement);
        }
    </script>
</body>
</html>
